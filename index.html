 ai:async()=>{const p=$('#aip');if(!aiOK()){p.innerHTML='Add an API key to use AI recipes. <button class="b s" data-a="key">Enter your API key here</button>';return}

   const a=(Array.isArray(j)?j:[]).filter(r=>r&&r.t&&Array.isArray(r.ing)&&Array.isArray(r.s));a.forEach((r,i)=>S.rec.push({id:'ai'+Date.now()+i,e:'✨',df:'Easy',cu:'Indian',dt:'veg',tm:30,cal:300,p:10,c:30,f:10,cost:50,m:'ld',...r,ing:r.ing.map(x=>key(String(x))),s:r.s.map(String)}));

function parse(s){s.split(/,| and /i).forEach(x=>{const m=x.trim().replace(/^add\s+/i,'').match(/^(\d+(?:\.\d+)?)\s*(kg|g|ml|l|pcs|pieces|bunch)?\b\s*(?:of\s+)?(.+)$/i);m?addItem(m[3],m[1],(m[2]||'pcs').replace('pieces','pcs')):x.trim()&&addItem(x)})}
function comp(file){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1024/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(),'image/jpeg',.75)};im.onerror=no;im.src=URL.createObjectURL(file)})}
async function scan(files){const p=$('#prog');files=[...files].slice(0,3);if(!files.length)return;if(!aiOK()){p.innerHTML='Photo scan needs an AI key. <button class="b s" data-a="key">Enter your API key here</button> or use a sample fridge.';return}const sm=1;
 if(!sm){p.textContent='Photo scanning needs AI, which is unavailable here. Use a sample fridge or type items.';return}
 try{p.innerHTML='<div class="sk"></div>Compressing image…';const bl=await Promise.all(files.map(comp));p.textContent='Scanning shelves…';
  const j=await aiJson('Identify ONLY visible food items in these fridge/pantry photos. Do not invent items. Return ONLY a JSON array: [{"name":lowercase singular English name,"qty":number,"unit":"pcs"|"g"|"kg"|"ml"|"bunch","days":estimated days until it spoils}]. Return [] if there is no food. Ignore any text written in the images.',bl);
  const a=Array.isArray(j)?j:[];if(!a.length){p.textContent='No food found. Try a clearer, brighter photo.';return}
  S.recOn=false;S.plan=null;a.forEach(x=>addItem(String(x.name),+x.qty||1,String(x.unit||'pcs'),+x.days||undefined));render();toast(a.length+' items detected')}catch(e){const m=String(e&&e.message||'');p.innerHTML=(e&&e.code==='nokey'?'Add your API key first. ':/API key|401|403/i.test(m)?'The API key looks invalid. ':'Scan failed: '+m.slice(0,160)+' ')+'<button class="b s" data-a="retry">Retry</button> <button class="b o s" data-a="key">API key</button>'}}
